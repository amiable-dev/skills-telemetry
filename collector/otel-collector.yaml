# OpenTelemetry Collector: normalise gen_ai.*, enrich std.*, drop content, fan out.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 512 }

  # 1. Drop content — defence in depth regardless of harness settings.
  attributes/drop_content:
    actions:
      - { key: gen_ai.prompt,      action: delete }
      - { key: gen_ai.completion,  action: delete }
      - { pattern: ^gen_ai\.input\..*,  action: delete }
      - { pattern: ^gen_ai\.output\..*, action: delete }
      - { pattern: ^tool\.(input|output|arguments|result).*, action: delete }
      # ADR-009. The SubagentStop payload carries the sub-agent's final reply and
      # the path to its transcript. Neither has a code path to a span, but the
      # rule is that metadata-only is enforced here rather than trusted upstream
      # (ADR-005), and this collector also receives spans from harnesses we do
      # not write.
      - { key: last_assistant_message, action: delete }
      - { pattern: ^std\.subagent\.(transcript|path|message).*, action: delete }
      # ADR-014 decision 3: both harnesses' native content keys. The rule since
      # decision 14 is that nothing past this collector ever holds content, and a
      # harness can send it here — Claude Code with OTEL_LOG_TOOL_DETAILS=1, and
      # Copilot despite captureContent:false (microsoft/vscode#326254). `prompt`
      # and `response` arrive as "<REDACTED>" by default (verified live
      # 2026-09-30); a placeholder today is a value if a flag is flipped.
      - { key: tool_input,      action: delete }
      - { key: tool_parameters, action: delete }
      - { key: full_command,    action: delete }
      - { key: bash_command,    action: delete }
      - { key: error,           action: delete }
      - { key: prompt,          action: delete }
      - { key: response,        action: delete }
      - { key: file_path,       action: delete }
      - { pattern: ^github\.copilot\.tool\.parameters\.(command|file_path)$, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.tool.definitions,    action: delete }
      - { pattern: ^gen_ai\.tool\.call\.(arguments|result)$, action: delete }

  # 2. Normalise semconv drift across SDKs/harnesses (rename map; extend as spec moves).
  transform/normalise:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["llm.model_name"] != nil and attributes["gen_ai.request.model"] == nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.prompt_tokens"] != nil and attributes["gen_ai.usage.input_tokens"] == nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.completion_tokens"] != nil and attributes["gen_ai.usage.output_tokens"] == nil
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] == nil
          - delete_key(attributes, "llm.model_name")
          - delete_key(attributes, "gen_ai.usage.prompt_tokens")
          - delete_key(attributes, "gen_ai.usage.completion_tokens")

  # 3. Copilot: map generic tool-call spans that reference a catalogued skill onto std.skill.*
  #    (table is copilot-skill-map.yaml; values inlined here by `make collector-config`).
  transform/copilot_skills:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["std.skill.name"], attributes["gen_ai.tool.name"]) where resource.attributes["std.harness"] != "claude-code" and attributes["std.skill.name"] == nil and IsMatch(attributes["gen_ai.tool.name"], "^(structured-logging)$")
          - set(attributes["std.standard_id"], "STD-LOG-001") where attributes["std.skill.name"] == "structured-logging" and attributes["std.standard_id"] == nil
          - set(attributes["std.skill.version"], "2.3.0")   where attributes["std.skill.name"] == "structured-logging" and attributes["std.skill.version"] == nil

  # 4. Pseudonymise developer identity; report team-level by default.
  # ADR-014 decision 3. Identity sits on every metric data point, every event and
  # every span attribute set — verified live against Claude Code 2.1.284 — so a
  # resource-level rule never sees it. The email becomes the same pseudonym the
  # resource rule below computes; the account and organisation ids go.
  # #142: with the detailed view on, Claude Code puts the MCP server and tool
  # names, the Skill tool's skill_name and the Agent tool's subagent_type ONLY
  # inside tool_parameters — the JSON that also carries bash_command. tool_name is
  # the literal "mcp_tool" for every user-configured server. drop_content deletes
  # tool_parameters whole, so these names are lifted out first: an allowlist of
  # four keys, and only values shaped like a name (short, no spaces). Nothing
  # else in the JSON is read into an attribute. Runs before drop_content.
  transform/tool_names:
    error_mode: ignore
    log_statements:
      - context: log
        statements: &tool_names
          - merge_maps(cache, ParseJSON(attributes["tool_parameters"]), "upsert") where attributes["tool_parameters"] != nil
          - set(attributes["mcp_server_name"], cache["mcp_server_name"]) where IsString(cache["mcp_server_name"]) and IsMatch(cache["mcp_server_name"], "^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}$")
          - set(attributes["mcp_tool_name"], cache["mcp_tool_name"]) where IsString(cache["mcp_tool_name"]) and IsMatch(cache["mcp_tool_name"], "^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}$")
          - set(attributes["skill_name"], cache["skill_name"]) where IsString(cache["skill_name"]) and IsMatch(cache["skill_name"], "^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}$")
          - set(attributes["subagent_type"], cache["subagent_type"]) where IsString(cache["subagent_type"]) and IsMatch(cache["subagent_type"], "^[A-Za-z0-9][A-Za-z0-9_.:@/-]{0,127}$")
    trace_statements:
      - context: span
        statements: *tool_names

  transform/identity:
    error_mode: ignore
    trace_statements:
      - context: span
        statements: &identity
          - set(attributes["std.user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email")
          - delete_key(attributes, "user.account_uuid")
          - delete_key(attributes, "user.account_id")
          - delete_key(attributes, "user.id")
          - delete_key(attributes, "organization.id")
          # #128: Claude Code's repository URL (OTEL_METRICS_INCLUDE_REPOSITORY)
          # can carry a credential, https://x-access-token:...@host/. The
          # userinfo goes; the URL stays, since owner and name are not secret.
          - replace_pattern(attributes["vcs.repository.url.full"], "^([a-zA-Z][a-zA-Z0-9+.-]*://)[^@/]+@", "$${1}")
      - context: resource
        statements: &resource_identity
          - replace_pattern(attributes["vcs.repository.url.full"], "^([a-zA-Z][a-zA-Z0-9+.-]*://)[^@/]+@", "$${1}")
    log_statements:
      - context: log
        statements: *identity
      - context: resource
        statements: *resource_identity
    metric_statements:
      - context: datapoint
        statements: *identity
      - context: resource
        statements: *resource_identity

  # ADR-014 decision 3, ADR-013 for Copilot: `github.copilot.git.repository` and
  # `.branch` become `std.branch.hash`, computed exactly as stdtel.enrich does —
  # sha256("stdtel-branch:" + repo_id + "\n" + branch)[:16], where repo_id is the
  # remote as host/owner/name, lower-cased, without scheme, user, port or .git —
  # and then the plain values are deleted. A remote can carry a token
  # (https://x-access-token:...@), and a branch name can carry a customer's
  # name. tests/test_collector_privacy.py holds this equal to the Python.
  transform/copilot_git:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(cache["repo"], attributes["github.copilot.git.repository"]) where attributes["github.copilot.git.repository"] != nil
          - replace_pattern(cache["repo"], "/+$", "")
          - replace_pattern(cache["repo"], "\\.git$", "")
          - replace_pattern(cache["repo"], "/+$", "")
          - replace_pattern(cache["repo"], "^[a-zA-Z][a-zA-Z0-9+.-]*://(?:[^@/]+@)?([^/:]+)(?::[0-9]+)?/(.+)$", "$${1}/$${2}")
          - replace_pattern(cache["repo"], "^(?:[^@/:]+@)?([^:/]+):(.+)$", "$${1}/$${2}")
          - set(cache["repo"], ConvertCase(cache["repo"], "lower")) where cache["repo"] != nil
          - set(attributes["std.branch.hash"], Substring(SHA256(Concat(["stdtel-branch:", cache["repo"], "\n", attributes["github.copilot.git.branch"]], "")), 0, 16)) where cache["repo"] != nil and attributes["github.copilot.git.branch"] != nil
          - delete_key(attributes, "github.copilot.git.repository")
          - delete_key(attributes, "github.copilot.git.branch")

  transform/pseudonymise:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["std.user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email")
          - delete_key(attributes, "user.id")

  # Defence in depth for #42. prometheusremotewrite maps service.instance.id to
  # the `instance` label, so any producer that leaves it generated opens a new
  # series per process — a counter that reaches 1 and stops, and a rate() that is
  # structurally zero. stdtel pins it now; Copilot's native SDK does not, and we
  # do not control that. Stripped on the metrics pipeline only: traces keep it,
  # and no dashboard groups by instance.
  resource/collapse_instance:
    attributes:
      - { key: service.instance.id, action: delete }

  # ADR-014 decision 4: native metrics stay out of Prometheus. Every Claude Code
  # metric carries session.id as a label (verified live 2026-09-30), so each
  # opens a series per session; deleting the label instead recreates #92. The
  # per-request events carry everything the metrics do, so the warehouse — fed
  # from events and traces — is the one analytic path for native records.
  # Copilot's GenAI and copilot_chat metrics are dropped for the same reason.
  filter/native_metrics:
    error_mode: ignore
    metrics:
      metric:
        - IsMatch(name, "^claude_code\\.")
        - IsMatch(name, "^copilot_chat\\.")
        - IsMatch(name, "^gen_ai\\.client\\.")

  batch: {}

connectors:
  spanmetrics:
    histogram: { explicit: { buckets: [1s, 5s, 15s, 60s, 300s] } }
    dimensions:
      # ADR-009: kind and name are the two dimensions "where did the tokens go,
      # by artefact" needs. Both are bounded — kind is a four-value enum, name is
      # a catalogue name, an agent type or a compaction reason. std.prompt.id is
      # deliberately NOT here: it is unbounded, and a dimension per turn is the
      # same defect as #42 one layer up.
      - { name: std.artefact.kind }
      - { name: std.artefact.name }
      - { name: std.artefact.source }
      # ADR-010 containment. name is the scoping artefact and key is the unit
      # instance (a branch hash, ADR-013), both bounded. std.scope.id is NOT
      # here: it is unique per container instance, which is #42 again.
      - { name: std.scope.name }
      - { name: std.scope.key }
      - { name: std.scope.source }
      - { name: std.subagent.type }
      - { name: std.skill.name }
      - { name: std.skill.version }
      - { name: std.skill.trigger }
      - { name: std.skill.plugin }
      - { name: std.harness }
      - { name: gen_ai.request.model }
      - { name: std.team }
    metrics_flush_interval: 30s
    # The connector keeps one cumulative counter per distinct resource. A stdtel
    # resource carries std.branch.hash, std.repo, std.user.hash and the SDK version:
    # none are metric labels, all of them change (a branch switch, another
    # project, an upgrade). Keyed on the whole resource, each change started a new
    # counter at 1 under the same labels, Prometheus kept one, and every rate()
    # read zero while Tempo held every span. Keyed on service.name, they add up.
    # Dimensions are still read per span, so std.team from the resource stays
    # correct. Anything added here must not vary between hook processes.
    resource_metrics_key_attributes: [service.name]

exporters:
  # ADR-014 decision 4: harness-native events — Claude Code's per-request cost,
  # tokens and skill attribution exist only here. Loki 3 ingests OTLP natively,
  # and attributes land as structured metadata, which the loader reads.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  debug: { verbosity: basic }

service:
  # Bind the collector's own metrics to all interfaces so the host can ask
  # "did you accept that span?" — the default binds to localhost inside the
  # container, and the image is distroless, so there is no shell to ask from.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/tool_names, attributes/drop_content, transform/identity, transform/copilot_git, transform/normalise, transform/copilot_skills, transform/pseudonymise, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, filter/native_metrics, attributes/drop_content, transform/identity, resource/collapse_instance, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/tool_names, attributes/drop_content, transform/identity, batch]
      exporters: [otlphttp/loki]
