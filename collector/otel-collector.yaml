# OpenTelemetry Collector: normalise gen_ai.*, enrich std.*, drop content, fan out.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 512 }

  # 1. Drop content — defence in depth regardless of harness settings.
  attributes/drop_content:
    actions:
      - { key: gen_ai.prompt,      action: delete }
      - { key: gen_ai.completion,  action: delete }
      - { pattern: ^gen_ai\.input\..*,  action: delete }
      - { pattern: ^gen_ai\.output\..*, action: delete }
      - { pattern: ^tool\.(input|output|arguments|result).*, action: delete }

  # 2. Normalise semconv drift across SDKs/harnesses (rename map; extend as spec moves).
  transform/normalise:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["llm.model_name"] != nil and attributes["gen_ai.request.model"] == nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.prompt_tokens"] != nil and attributes["gen_ai.usage.input_tokens"] == nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.completion_tokens"] != nil and attributes["gen_ai.usage.output_tokens"] == nil
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] == nil
          - delete_key(attributes, "llm.model_name")
          - delete_key(attributes, "gen_ai.usage.prompt_tokens")
          - delete_key(attributes, "gen_ai.usage.completion_tokens")

  # 3. Copilot: map generic tool-call spans that reference a catalogued skill onto std.skill.*
  #    (table is copilot-skill-map.yaml; values inlined here by `make collector-config`).
  transform/copilot_skills:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["std.skill.name"], attributes["gen_ai.tool.name"]) where resource.attributes["std.harness"] != "claude-code" and attributes["std.skill.name"] == nil and IsMatch(attributes["gen_ai.tool.name"], "^(structured-logging)$")
          - set(attributes["std.standard_id"], "STD-LOG-001") where attributes["std.skill.name"] == "structured-logging" and attributes["std.standard_id"] == nil
          - set(attributes["std.skill.version"], "2.3.0")   where attributes["std.skill.name"] == "structured-logging" and attributes["std.skill.version"] == nil

  # 4. Pseudonymise developer identity; report team-level by default.
  transform/pseudonymise:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["std.user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"] != nil
          - delete_key(attributes, "user.email")
          - delete_key(attributes, "user.id")

  batch: {}

connectors:
  spanmetrics:
    histogram: { explicit: { buckets: [1s, 5s, 15s, 60s, 300s] } }
    dimensions:
      - { name: std.skill.name }
      - { name: std.skill.version }
      - { name: std.skill.trigger }
      - { name: std.harness }
      - { name: gen_ai.request.model }
      - { name: std.team }
    metrics_flush_interval: 30s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  debug: { verbosity: basic }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop_content, transform/normalise, transform/copilot_skills, transform/pseudonymise, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop_content, batch]
      exporters: [debug]
