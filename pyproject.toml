[project]
name = "stdtel"
version = "0.2.3"
description = "Telemetry and metadata capture for standards-as-skills (Claude Code + Copilot)"
readme = "README.md"
license = "MIT"
keywords = ["telemetry", "opentelemetry", "claude-code", "copilot", "skills", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.urls]
Homepage = "https://github.com/amiable-dev/skills-telemetry"
Repository = "https://github.com/amiable-dev/skills-telemetry"
Issues = "https://github.com/amiable-dev/skills-telemetry/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
warehouse = ["psycopg[binary]>=3.1", "requests>=2.31"]   # warehouse/load_traces.py

[project.scripts]
stdtel-validate = "stdtel.manifest:cli"
stdtel-install = "stdtel.install:main"
stdtel-policy-report = "stdtel.policy_report:main"
stdtel-doctor = "stdtel.doctor:main"
stdtel-statusline = "stdtel.statusline:main"
stdtel-export = "stdtel.spool_export:main"
stdtel-hook = "stdtel.hooks.cli:main"
stdtel-eval = "eval.run_eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stdtel*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
