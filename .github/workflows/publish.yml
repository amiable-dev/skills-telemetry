name: publish

# PyPI Trusted Publishing (OIDC): no long-lived token lives in this repo, and the
# publish action produces PEP 740 attestations. The publisher must be registered
# on PyPI before the first run — see docs/releasing.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        # Test PyPI only. A manual dispatch has no tag, so the version check
        # below cannot run — and PyPI never allows re-uploading a version, so a
        # mistaken manual publish burns that number for good. The real index is
        # reachable only by publishing a release.
        options: [testpypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build

      - name: the version must match the tag
        # A release tagged v0.3.0 that ships 0.2.9 is the kind of mismatch nobody
        # notices until an install produces the wrong code. Tag-triggered only;
        # a manual run has no tag to check against.
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/stdtel-${TAG}-py3-none-any.whl" || {
            echo "::error::no wheel for tag ${TAG} — bump the version in all five places - see docs/releasing.md"
            ls dist; exit 1; }

      - name: the wheel must actually install and run
        # Publishing something that cannot be installed is worse than not
        # publishing: it fails on someone else's machine, not ours.
        run: |
          uv venv --python 3.12 /tmp/verify
          # --python, not VIRTUAL_ENV: with the env var alone uv checked the
          # active environment instead and reported "Checked 1 package",
          # installing nothing while appearing to succeed.
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          for script in stdtel-validate stdtel-install stdtel-doctor stdtel-policy-report \
                        stdtel-statusline stdtel-export stdtel-eval; do
            test -x "/tmp/verify/bin/$script" || { echo "::error::$script missing from the wheel"; exit 1; }
          done
          /tmp/verify/bin/stdtel-validate --help > /dev/null
          echo '{}' | /tmp/verify/bin/stdtel-hook session-start
          /tmp/verify/bin/stdtel-doctor --quiet || true   # reports, never gates

      - name: the version must not already exist on the index
        # Uploading a version that exists fails at the very last step with an
        # opaque 400. Checking first says which version and why, before anything
        # is attempted.
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INDEX=https://pypi.org
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && INDEX=https://test.pypi.org
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$INDEX/pypi/stdtel/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "::error::stdtel $VERSION is already published on $INDEX and cannot be replaced. Bump the version in all five places - see docs/releasing.md."
            exit 1
          fi
          echo "stdtel $VERSION is free on $INDEX"

      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    # Release-only, deliberately: see the note on the dispatch input above.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
