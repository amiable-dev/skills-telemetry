name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: install opa
        # Without it the policy tests skip, and the primary metric would go
        # unexercised in CI while the run still reported green.
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: install the package
        # A venv, not --system: the runner's Python is externally managed.
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: stdtel-validate skills           # front-matter contract gate
      - run: python -m eval.power --check     # published figures must be reproducible
      - run: python -m pytest -q
      - name: policy tests must not have skipped
        # A skipped suite is indistinguishable from a passing one in the summary,
        # so assert on it rather than printing it.
        run: |
          out=$(python -m pytest -q tests/test_policies.py)
          echo "$out" | tail -2
          if echo "$out" | grep -q skipped; then
            echo "::error::policy tests skipped - opa missing, the primary metric went untested"
            exit 1
          fi
      - run: python -m eval.run_eval --dry-run --out /tmp/eval.jsonl

  policy-results:
    # Produces the policy_result artefact the primary metric is computed from.
    # run_seq must be recorded here: after the fact, re-runs and retries make the
    # true ordering unknowable, and "first-time pass" is the whole metric.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: install opa
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - run: |
          uv venv --python 3.12
          uv pip install -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: grade the tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stdtel-policy-report \
            --pr-id "${{ github.repository }}#${{ github.event.pull_request.number }}" \
            --derive-run-seq "${{ github.repository }}" ci.yml "${{ github.head_ref }}" \
            --out policy-results.jsonl
          cat policy-results.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: policy-results
          path: policy-results.jsonl

  distribution:
    # ADR-001: the install channel must keep working from a clean machine, and a
    # hook must run with no environment at all — that is what a hook shell gives it.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: install as a tool, as a user would
        run: uv tool install dist/*.whl
      - name: hook survives an empty environment
        run: |
          echo '{"session_id":"ci","tool_name":"Skill","tool_use_id":"c1","tool_input":{"skill":"p:structured-logging"}}' \
            | env -i "$(uv tool dir --bin)/stdtel-hook" pre-tool-use
      - name: installer resolves an absolute path
        run: |
          BIN="$(uv tool dir --bin)/stdtel-install"
          test "$("$BIN" where | cut -c1)" = "/" || { echo "not absolute"; exit 1; }
          "$BIN" hooks --harness copilot-vscode | grep -q STDTEL_HARNESS
