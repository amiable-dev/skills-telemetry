# Toolchain for skills-telemetry. `mise install` then `mise run test`.
#
# The venv is for development only: the hooks Claude Code fires must be on the
# PATH it launches with, which a project venv is not. See README "Install once,
# globally" for that side.

[tools]
python = "3.13"          # pyproject allows >=3.10; CI pins 3.12

[env]
# --seed puts pip in the venv: mise creates it with uv, which omits pip, and a
# pip-less venv silently sends `pip install` to the interpreter behind it.
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.install]
description = "Install the package and dev extras into the project venv"
run = "make install"

[tasks.test]
description = "Run the test suite"
run = "make test"
depends = ["install"]

[tasks.validate]
description = "SKILL.md front-matter contract gate (what CI runs)"
run = "make validate"

[tasks.skill-map]
description = "Regenerate collector/copilot-skill-map.yaml from the catalogue"
run = "make skill-map"

[tasks.up]
description = "Bring up the local collector/Tempo/Prometheus/Grafana stack"
run = "make up"

[tasks.smoke]
description = "Verify every hop of the local stack and name the one that broke"
run = "./deploy/smoke.sh"

[tasks.up-langfuse]
description = "Local stack plus self-hosted Langfuse (ADR-006); needs deploy/.env"
run = """
set -a; . deploy/.env; set +a
export LANGFUSE_AUTH=$(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 | tr -d '\n')
export STDTEL_COLLECTOR_OVERLAY=overlay-langfuse.yaml
cd deploy && $(docker compose version >/dev/null 2>&1 && echo docker compose || echo docker-compose) --profile langfuse up -d
"""

[tasks.down]
description = "Tear the local stack down"
run = "make down"

[tasks.eval]
description = "Offline with/without-skill eval, graded by OPA against policies/"
run = "make eval"

[tasks.eval-dry]
description = "Offline with/without-skill eval, no OPA required"
run = "make eval-dry"

[tasks.power]
description = "Regenerate the sample-size tables in docs/evaluation-power.md"
run = "python -m eval.power"

[tasks.power-check]
description = "Fail if docs/evaluation-power.md has drifted from eval/power.py"
run = "python -m eval.power --check"

[tasks.ci]
description = "Everything CI checks, in order"
depends = ["install"]
run = ["make validate", "make test", "make eval-dry", "python -m eval.power --check"]
