services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    # A second --config is merged over the first. The default overlay is a no-op,
    # so the Langfuse exporter only exists when you ask for it.
    command:
      - "--config=/etc/otelcol/otel-collector.yaml"
      - "--config=/etc/otelcol/${STDTEL_COLLECTOR_OVERLAY:-overlay-none.yaml}"
    volumes: ["../collector:/etc/otelcol:ro"]
    env_file: [".env"]
    environment:
      # Derived from the two keys in .env, so it cannot live there. Passed
      # through from the shell; empty unless the langfuse overlay is selected.
      LANGFUSE_AUTH: "${LANGFUSE_AUTH:-}"
    ports: ["4317:4317", "4318:4318", "8888:8888"]   # 8888 = the collector's own metrics
    depends_on: [tempo, prometheus]
  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    ports: ["3200:3200"]
  prometheus:
    image: prom/prometheus:v3.2.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [tempo, prometheus]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: stdtel, POSTGRES_DB: stdtel }
    volumes: ["../warehouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"]
    ports: ["5432:5432"]

  # --- Langfuse (opt-in): docker compose --profile langfuse up -d ---
  # Ports are remapped: upstream defaults collide with Grafana (3000),
  # our warehouse Postgres (5432) and Prometheus (9090).
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: ["langfuse"]
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    ports: ["3001:3000"]
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"
      # deterministic bootstrap so the collector can authenticate without UI steps
      LANGFUSE_INIT_ORG_ID: stdtel
      LANGFUSE_INIT_PROJECT_ID: stdtel
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["langfuse"]
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      langfuse-clickhouse: { condition: service_healthy }
      langfuse-redis: { condition: service_healthy }
      langfuse-minio: { condition: service_healthy }
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      TELEMETRY_ENABLED: "false"

  langfuse-postgres:
    image: postgres:17
    profiles: ["langfuse"]
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: ["langfuse-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ["langfuse"]
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: default, CLICKHOUSE_PASSWORD: langfuse }
    volumes: ["langfuse-clickhouse:/var/lib/clickhouse"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      # the native protocol on 9000 is what the migrator uses, and it starts
      # listening well after the container reports "running"
      test: ["CMD-SHELL", "clickhouse-client --password langfuse --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  langfuse-redis:
    image: redis:7
    profiles: ["langfuse"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-minio:
    image: minio/minio
    profiles: ["langfuse"]
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: miniosecret }
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    entrypoint: sh -c 'mkdir -p /data/langfuse && exec minio server /data --console-address ":9001"'
    volumes: ["langfuse-minio:/data"]

volumes:
  tempo-data: {}
  langfuse-postgres: {}
  langfuse-clickhouse: {}
  langfuse-minio: {}
