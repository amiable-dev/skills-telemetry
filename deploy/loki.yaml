# Loki for the local stack (ADR-014 decision 4): the store for harness-native
# events, which carry each model request's cost, tokens and skill attribution.
# Single-binary, filesystem-backed, no auth: the stack binds to loopback by
# default, as every other service here does. Structured metadata must be on —
# OTLP attributes land there, and the loader reads them.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # 30 days: the warehouse is the long-term store; Loki is where the loader reads from
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
