# Move to .github/workflows/ci.yml in the standards repo.
name: standards-telemetry
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m stdtel.manifest skills          # front-matter contract gate
      - run: python -m pytest -q
      - run: python -m eval.run_eval --dry-run --out /tmp/eval.jsonl
